# helm-values/prometheus-values.yaml
# Chart: prometheus-community/kube-prometheus-stack  v65.2.0
# App versions: Prometheus 2.55.0, Grafana 11.3.1
# Security patches: Grafana CVE-2024-9264, CVE-2024-6322 fixed in 11.3.x

# ── Prometheus ─────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    image:
      tag: v2.55.0     # Pinned

    retention: 7d
    retentionSize: "8GB"
    routePrefix: /prometheus
    externalUrl: https://192.168.56.50/prometheus

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          storageClassName: "local-path"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

    # Watch ServiceMonitors in all namespaces (postgres metrics, etc.)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534    # nobody
      runAsGroup: 65534
      fsGroup: 65534

    containers:
      - name: prometheus
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]

  service:
    type: ClusterIP    # Exposed via dedicated NodePort service (prometheus-nodeport.yaml)
    port: 9090

# ── Disable control-plane monitors (bind to 127.0.0.1 on kubeadm clusters) ─────
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# ── Alertmanager ───────────────────────────────────────────────────────────────
alertmanager:
  enabled: false       # Disabled to conserve resources on 8GB VM

# ── Grafana ────────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  image:
    tag: "11.3.1"      # Pinned — fixes CVE-2024-9264

  # Credentials injected at deploy time by the operator
  adminUser: admin
  adminPassword: ""

  deploymentStrategy:
    type: Recreate


  service:
    type: ClusterIP    # Exposed via Istio Gateway at /grafana (HTTPS :30443)
    port: 80

  persistence:
    enabled: true
    storageClassName: ""
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # ── Grafana security hardening ───────────────────────────────────────────────
  grafana.ini:
    server:
      # Sub-path routing via Istio Gateway VirtualService
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
      # Disable embedded frame (clickjacking protection)
      enable_gzip: true

    security:
      disable_gravatar: true
      cookie_secure: true
      strict_transport_security: true
      strict_transport_security_max_age_seconds: 86400
      x_content_type_options: true
      x_xss_protection: true
      content_security_policy: true
      # Disable Angular-based plugins (XSS risk)
      angular_support_enabled: false

    users:
      allow_sign_up: false
      allow_org_create: false
      auto_assign_org_role: Viewer

    auth.anonymous:
      enabled: false

    analytics:
      reporting_enabled: false
      check_for_updates: false

    log:
      mode: console
      level: warn

  # ── Security context for Grafana pod ─────────────────────────────────────────
  securityContext:
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    runAsNonRoot: true

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false    # Grafana writes dashboards to disk
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault



  # ── Pre-loaded dashboards (from Grafana.com) ──────────────────────────────────
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: "Platform"
          type: file
          options:
            path: /var/lib/grafana/dashboards/platform

  dashboards:
    platform:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6781
        revision: 1
        datasource: Prometheus
      postgres-overview:
        gnetId: 9628
        revision: 7
        datasource: Prometheus
      airflow-overview:
        gnetId: 19279
        revision: 1
        datasource: Prometheus
      istio-mesh:
        gnetId: 7639
        revision: 1
        datasource: Prometheus

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

# ── Node Exporter (disabled for lightweight lab footprint) ───────────────────
nodeExporter:
  enabled: false

# ── kube-state-metrics (disabled for lightweight lab footprint) ───────────────
kubeStateMetrics:
  enabled: false

# ── Prometheus Operator ────────────────────────────────────────────────────────
prometheusOperator:
  tls:
    enabled: false
  serviceMonitor:
    selfMonitor: false
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
