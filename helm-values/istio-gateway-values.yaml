# helm-values/istio-gateway-values.yaml
# Istio Ingress Gateway — NodePort for VirtualBox (no cloud load balancer)
# Chart: istio/gateway  v1.24.2

service:
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
      nodePort: 30021       # Istio health check
    - name: http2
      port: 80
      targetPort: 8080
      nodePort: 30080       # HTTP — redirects to HTTPS
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443       # HTTPS — Grafana /grafana + Airflow /airflow

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

# Security context for gateway pods
securityContext:
  runAsUser: 1337      # Istio proxy UID
  runAsGroup: 1337
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]    # Required for ports 80/443
  readOnlyRootFilesystem: false

podAnnotations:
  # Prometheus scraping for gateway metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "15090"
  prometheus.io/path: "/stats/prometheus"
