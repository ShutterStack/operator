---
# =============================================================================
# operator-install.yaml  —  PHASE 1: One-time operator bootstrap
#
# Apply this file ONCE to install the operator into your cluster.
# After the kopf-operator pod is Running, proceed to platform-config.yaml.
#
# Usage:
#   kubectl apply -f manifests/operator-install.yaml
#   kubectl rollout status deployment/kopf-operator -n operator
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Namespace
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: operator
  labels:
    app.kubernetes.io/managed-by: kopf-operator

---
# ─────────────────────────────────────────────────────────────────────────────
# SECTION 2: CRDs (all 5 platform CRDs bundled here)
# ─────────────────────────────────────────────────────────────────────────────

# CRD 1 — PlatformStack (full stack in one CR)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformstacks.platform.ops
spec:
  group: platform.ops
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                components:
                  type: object
                  properties:
                    istio:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                    postgres:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                    monitoring:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                    airflow:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                istio:
                  type: object
                  properties:
                    profile:
                      type: string
                      default: "default"
                      enum: ["default", "minimal", "demo"]
                    gatewayHosts:
                      type: array
                      items: { type: string }
                    gatewayIpSans:
                      type: array
                      items: { type: string }
                postgres:
                  type: object
                  properties:
                    database:
                      type: string
                      default: "appdb"
                    username:
                      type: string
                      default: "appuser"
                    storageSize:
                      type: string
                      default: "10Gi"
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                monitoring:
                  type: object
                  properties:
                    storageSize:
                      type: string
                      default: "10Gi"
                    retention:
                      type: string
                      default: "7d"
                    grafana:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        adminPassword:
                          type: string
                airflow:
                  type: object
                  properties:
                    executor:
                      type: string
                      default: "KubernetesExecutor"
                      enum: ["KubernetesExecutor", "LocalExecutor", "CeleryExecutor"]
                    webserverReplicas:
                      type: integer
                      default: 1
                    schedulerReplicas:
                      type: integer
                      default: 1
                    gitSync:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        repo:
                          type: string
                        branch:
                          type: string
                          default: "main"
                        subPath:
                          type: string
                          default: "dags"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: mTLS
          type: string
          jsonPath: .status.mtls
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: platformstacks
    singular: platformstack
    kind: PlatformStack
    shortNames: ["ps", "pstack"]

---
# CRD 2 — PostgresInstance
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresinstances.platform.ops
spec:
  group: platform.ops
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                database: { type: string, default: "appdb" }
                username: { type: string, default: "appuser" }
                storageSize: { type: string, default: "10Gi" }
                replicas: { type: integer, default: 1, minimum: 1 }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: postgresinstances
    singular: postgresinstance
    kind: PostgresInstance
    shortNames: ["pg", "pgdb"]

