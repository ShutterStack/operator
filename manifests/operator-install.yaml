---
# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3: RBAC
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopf-operator
  namespace: operator
  labels:
    app.kubernetes.io/name: kopf-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kopf-operator-role
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.ops]
    resources:
      - platformstacks
      - platformstacks/status
      - platformstacks/finalizers
      - postgresinstances
      - postgresinstances/status
      - postgresinstances/finalizers
      - istioconfigs
      - istioconfigs/status
      - istioconfigs/finalizers
      - monitoringstacks
      - monitoringstacks/status
      - monitoringstacks/finalizers
      - airflowinstances
      - airflowinstances/status
      - airflowinstances/finalizers
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - secrets
      - serviceaccounts
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, clusterissuers, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.istio.io]
    resources: [gateways, virtualservices, destinationrules, serviceentries, sidecars]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [security.istio.io]
    resources: [peerauthentications, authorizationpolicies, requestauthentications]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources:
      - prometheuses
      - prometheusrules
      - alertmanagers
      - alertmanagerconfigs
      - servicemonitors
      - podmonitors
      - probes
      - thanosrulers
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kopf-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopf-operator-role
subjects:
  - kind: ServiceAccount
    name: kopf-operator
    namespace: operator

---
# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4: Operator Deployment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopf-operator
  namespace: operator
  labels:
    app.kubernetes.io/name: kopf-operator
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kopf-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kopf-operator
    spec:
      serviceAccountName: kopf-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kopf-operator
          # Image built locally via: podman build -t kopf-operator:latest .
          # Loaded into cluster via:
          #   podman save kopf-operator:latest | sudo ctr -n k8s.io images import -
          image: kopf-operator:latest
          imagePullPolicy: Never
          args:
            - run
            - /app/platform_operator/main.py
            - --all-namespaces
            - --liveness=http://0.0.0.0:8080/healthz

          ports:
            - name: healthz
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: helm-cache
              mountPath: /home/appuser/.cache
            - name: helm-config
              mountPath: /home/appuser/.config

      volumes:
        - name: helm-cache
          emptyDir: {}
        - name: helm-config
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: kopf-operator
  namespace: operator
spec:
  selector:
    app.kubernetes.io/name: kopf-operator
  ports:
    - name: healthz
      port: 8080
      targetPort: healthz
  type: ClusterIP
