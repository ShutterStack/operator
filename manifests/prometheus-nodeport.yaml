---
# Expose Prometheus UI directly on NodePort 30090
# Accessible from Windows at: http://192.168.56.50:30090
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-nodeport
    app.kubernetes.io/managed-by: kopf-operator
spec:
  type: NodePort
  selector:
    # Selects the Prometheus server pod created by kube-prometheus-stack
    app.kubernetes.io/name: prometheus
    prometheus: kube-prometheus-stack-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
