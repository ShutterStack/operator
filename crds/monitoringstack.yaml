---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitoringstacks.platform.ops
spec:
  group: platform.ops
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                storageSize:
                  type: string
                  default: "10Gi"
                  description: "Prometheus TSDB PVC size"
                retention:
                  type: string
                  default: "7d"
                  description: "Prometheus data retention period"
                grafana:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    adminPassword:
                      type: string
                      description: "Grafana admin password (auto-generated if empty)"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: GrafanaUrl
          type: string
          jsonPath: .status.grafanaUrl
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      subresources:
        status: {}

  scope: Namespaced
  names:
    plural: monitoringstacks
    singular: monitoringstack
    kind: MonitoringStack
    shortNames: ["ms", "mon"]
