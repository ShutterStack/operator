apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform-operator.clusterRoleName" . }}
  labels:
    {{- include "platform-operator.labels" . | nindent 4 }}
rules:
  # ── Operator Custom Resources ──────────────────────────────────────────────
  - apiGroups: ["platform.ops"]
    resources:
      - platformstacks
      - platformstacks/status
      - postgresinstances
      - postgresinstances/status
      - istioconfigs
      - istioconfigs/status
      - monitoringstacks
      - monitoringstacks/status
      - airflowinstances
      - airflowinstances/status
    verbs: ["*"]

  # ── Kopf peering / coordination / leases ──────────────────────────────────
  - apiGroups: ["zalando.org", "kopf.dev"]
    resources:
      - kopfpeerings
      - clusterkopfpeerings
      - kopfpeerings/status
      - clusterkopfpeerings/status
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]

  # ── Kubernetes Core Resources ──────────────────────────────────────────────
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - pods/status
      - services
      - services/status
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - secrets
      - serviceaccounts
      - events
    verbs: ["*"]

  # ── Apps & Batch ───────────────────────────────────────────────────────────
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - deployments/status
      - statefulsets
      - statefulsets/scale
      - statefulsets/status
      - daemonsets
      - replicasets
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["*"]

  # ── RBAC & Security ────────────────────────────────────────────────────────
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
      - podsecuritypolicies
    verbs: ["*"]

  # ── Networking & Ingress ───────────────────────────────────────────────────
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: ["*"]

  # ── Istio Service Mesh ─────────────────────────────────────────────────────
  - apiGroups:
      - "networking.istio.io"
      - "security.istio.io"
      - "telemetry.istio.io"
      - "install.istio.io"
    resources: ["*"]
    verbs: ["*"]

  # ── cert-manager ───────────────────────────────────────────────────────────
  - apiGroups: ["cert-manager.io", "acme.cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - clusterissuers
      - issuers
    verbs: ["*"]

  # ── Prometheus Operator Monitoring ─────────────────────────────────────────
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagers
      - alertmanagerconfigs
      - prometheuses
      - prometheusrules
      - servicemonitors
      - podmonitors
      - probes
      - thanosrulers
    verbs: ["*"]

  # ── Custom Resource Definitions (CRDs) ────────────────────────────────────
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["*"]

  # ── Node & Cluster Info (Read-only) ────────────────────────────────────────
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["*"]
