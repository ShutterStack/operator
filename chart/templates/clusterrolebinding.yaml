apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform-operator.clusterRoleName" . }}-binding
  labels:
    {{- include "platform-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "platform-operator.clusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
