---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresinstances.platform.ops
spec:
  group: platform.ops
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                database:
                  type: string
                  default: "appdb"
                  description: "Database name to create"
                username:
                  type: string
                  default: "appuser"
                  description: "Database user (password is auto-generated)"
                storageSize:
                  type: string
                  default: "10Gi"
                  description: "PVC size for data storage"
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 5
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Database
          type: string
          jsonPath: .status.database
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      subresources:
        status: {}

  scope: Namespaced
  names:
    plural: postgresinstances
    singular: postgresinstance
    kind: PostgresInstance
    shortNames: ["pg", "pgdb"]
